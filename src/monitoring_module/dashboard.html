<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Processor — Monitor</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
    --text: #e2e8f0; --muted: #64748b; --accent: #6366f1;
    --green: #22c55e; --red: #ef4444; --yellow: #eab308; --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 15px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
  .status-label { font-size: 11px; color: var(--muted); }
  main { padding: 24px; display: grid; gap: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .card .value { font-size: 28px; font-weight: 700; }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); } .yellow { color: var(--yellow); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); }
  td { padding: 9px 16px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-success { background: rgba(34,197,94,.15); color: var(--green); }
  .badge-error { background: rgba(239,68,68,.15); color: var(--red); }
  .badge-skipped { background: rgba(100,116,139,.15); color: var(--muted); }
  .feed { height: 320px; overflow-y: auto; padding: 8px 0; }
  .feed-item { padding: 7px 16px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 80px 90px 1fr 70px; gap: 8px; align-items: center; font-size: 12px; }
  .feed-item:last-child { border-bottom: none; }
  .ts { color: var(--muted); font-size: 10px; }
  .bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .4s; }
  #conn { font-size: 10px; }
  #conn.ok { color: var(--green); } #conn.err { color: var(--red); }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>Document Processor</h1>
  <span class="status-label">Live Monitor</span>
  <span id="conn" class="ok" style="margin-left:auto">● connected</span>
</header>
<main>
  <div class="cards">
    <div class="card"><div class="label">Total Processed</div><div class="value blue" id="stat-total">0</div><div class="sub">documents</div></div>
    <div class="card"><div class="label">Success Rate</div><div class="value green" id="stat-rate">—</div><div class="sub" id="stat-success-sub">0 success / 0 error</div></div>
    <div class="card"><div class="label">Avg Duration</div><div class="value yellow" id="stat-avg">—</div><div class="sub">per stage (ms)</div></div>
    <div class="card"><div class="label">Errors</div><div class="value red" id="stat-errors">0</div><div class="sub">total stage failures</div></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-header"><span>Stage Performance</span></div>
      <table>
        <thead><tr><th>Module</th><th>Total</th><th>Errors</th><th>Avg ms</th></tr></thead>
        <tbody id="module-table"><tr><td colspan="4" style="color:var(--muted);padding:20px 16px">No data yet</td></tr></tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-header"><span>Routes</span></div>
      <div id="route-bars" style="padding:12px 16px">
        <div style="color:var(--muted)">No data yet</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Live Event Feed</span>
      <span id="feed-count" style="color:var(--muted)">0 events</span>
    </div>
    <div class="feed" id="feed"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let feedCount = 0;
let maxRoute = 1;

function fmt(n) { return n == null ? '—' : Number(n).toFixed(n >= 10 ? 0 : 1); }
function ts(iso) { return iso ? iso.split('T')[1].split('.')[0] : ''; }
function badge(s) {
  return `<span class="badge badge-${s}">${s}</span>`;
}

function updateStats(stats) {
  $('stat-total').textContent = stats.total;
  $('stat-rate').textContent = stats.total ? stats.success_rate + '%' : '—';
  $('stat-success-sub').textContent = `${stats.success} success / ${stats.error} error`;
  $('stat-avg').textContent = stats.total ? fmt(stats.avg_duration_ms) : '—';
  $('stat-errors').textContent = stats.error;

  // Module table
  const mods = stats.by_module;
  const moduleOrder = ['router','classifier','extractor','refiner','validator','generator'];
  const keys = [...new Set([...moduleOrder, ...Object.keys(mods)])].filter(k => mods[k]);
  if (keys.length) {
    $('module-table').innerHTML = keys.map(k => {
      const m = mods[k];
      const err = m.error || 0;
      return `<tr>
        <td>${k}</td>
        <td>${m.total}</td>
        <td class="${err ? 'red' : 'green'}">${err}</td>
        <td>${fmt(m.avg_ms)}</td>
      </tr>`;
    }).join('');
  }

  // Route bars
  const routes = stats.by_route;
  const total = Object.values(routes).reduce((a,b)=>a+b,0) || 1;
  const sorted = Object.entries(routes).sort((a,b)=>b[1]-a[1]);
  if (sorted.length) {
    $('route-bars').innerHTML = sorted.map(([r, n]) => `
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span>${r}</span><span style="color:var(--muted)">${n}</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${(n/total*100).toFixed(1)}%"></div></div>
      </div>`).join('');
  }
}

function addFeedItem(ev) {
  feedCount++;
  $('feed-count').textContent = feedCount + ' events';
  const div = document.createElement('div');
  div.className = 'feed-item';
  div.innerHTML = `
    <span class="ts">${ts(ev.timestamp)}</span>
    <span>${ev.module}</span>
    <span style="color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">
      ${ev.data.route ? 'route:' + ev.data.route : ''}
      ${ev.data.type ? 'type:' + ev.data.type : ''}
      ${ev.errors && ev.errors.length ? ev.errors[0] : ''}
    </span>
    <span>${badge(ev.status)}</span>`;
  const feed = $('feed');
  feed.prepend(div);
  while (feed.children.length > 200) feed.removeChild(feed.lastChild);
}

// Fetch initial stats
async function fetchStats() {
  try {
    const r = await fetch('/monitoring/stats');
    if (r.ok) updateStats(await r.json());
  } catch(e) {}
}
fetchStats();
setInterval(fetchStats, 10000);

// SSE
function connect() {
  const es = new EventSource('/monitoring/events');
  $('conn').textContent = '● connecting…';
  $('conn').className = 'ok';

  es.onopen = () => {
    $('conn').textContent = '● connected';
    $('dot').style.background = 'var(--green)';
  };
  es.onmessage = e => {
    try {
      const ev = JSON.parse(e.data);
      addFeedItem(ev);
      // Refresh stats every 5 events to avoid too many fetches
      if (feedCount % 5 === 0) fetchStats();
    } catch(_) {}
  };
  es.onerror = () => {
    $('conn').textContent = '● reconnecting…';
    $('conn').className = 'err';
    $('dot').style.background = 'var(--red)';
    es.close();
    setTimeout(connect, 3000);
  };
}
connect();
</script>
</body>
</html>
