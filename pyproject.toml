[project]
name = "document-processor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/document_processor",
    "src/llm_client",
    "src/router_module",
    "src/classifier_module",
    "src/extractor_module",
    "src/refiner_module",
    "src/validator_module",
    "src/generator_module",
    "src/monitoring_module",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
